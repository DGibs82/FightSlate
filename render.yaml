# FightSlate Render Blueprint.
# Secrets shared by the web service and every cron job live in ONE env group,
# so unsubscribe links signed by a cron job verify on the web service.
envVarGroups:
  - name: fightslate-shared
    envVars:
      - key: TOKEN_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      # Email is logged, not sent, until this is set to "true" deliberately.
      - key: EMAIL_ENABLED
        value: "false"
      # Optional licensed data sources (leave empty to disable).
      - key: UFCALENDAR_API_KEY
        sync: false
      - key: BOXERBOOK_API_KEY
        sync: false

databases:
  - name: fightslate-postgres
    plan: basic-256mb
    databaseName: fightslate
    user: fightslate

services:
  - type: web
    name: fightslate-web
    runtime: node
    plan: starter
    buildCommand: npm install && npm run db:generate
    preDeployCommand: npm run db:migrate && npm run seed
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fightslate-postgres
          property: connectionString
      - key: ADMIN_TOKEN
        generateValue: true
      - key: INGEST_INTERVAL_MINUTES
        value: "60"
      - fromGroup: fightslate-shared

  - type: cron
    name: fightslate-new-fight-alerts
    runtime: node
    plan: starter
    schedule: "5,35 * * * *"
    buildCommand: npm install && npm run db:generate
    startCommand: npm run notify:new
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fightslate-postgres
          property: connectionString
      - fromGroup: fightslate-shared

  - type: cron
    name: fightslate-upcoming-reminders
    runtime: node
    plan: starter
    schedule: "0 * * * *"
    buildCommand: npm install && npm run db:generate
    startCommand: npm run notify:upcoming
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fightslate-postgres
          property: connectionString
      - fromGroup: fightslate-shared
