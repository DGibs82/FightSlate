<!doctype html><html><body style="font-family:system-ui;background:#090d13;color:white;padding:30px"><h1>FightSlate Admin</h1><p>Use the Render dashboard for cron history and logs. Manual controls:</p><input id="token" placeholder="Admin token" style="padding:10px;width:320px"><p><button onclick="run('/internal/seed')">Refresh seed</button> <button onclick="run('/internal/notify/new')">Send new-fight alerts</button> <button onclick="run('/internal/notify/upcoming')">Send reminders</button></p><pre id="out"></pre><script>async function run(url){const r=await fetch(url,{method:'POST',headers:{Authorization:'Bearer '+token.value}});out.textContent=await r.text()}</script></body></html>
